<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Savorly</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         SPLASH SCREEN
         ========================= -->

    <section id="splash-screen" class="splash-screen">

        <div class="splash-content">

            <div class="logo-icon">
                <img src="assets/savorly-logo.png" alt="Savorly logo">
            </div>
            <h1>Savorly</h1>

            <p>Find something worth making.</p>

        </div>

    </section>


    <!-- =========================
         APP
         ========================= -->

    <div id="app" class="app">

        <!-- HEADER -->

        <header class="header">

            <button id="home-logo" class="brand" type="button">
                <span class="brand-icon">
    <img src="assets/savorly-logo.png" alt="Savorly logo">
</span>
                <span>Savorly</span>
            </button>

            <button id="saved-button" class="saved-button" type="button">
                ♡ Saved
            </button>

        </header>


        <!-- =========================
             HOME / SEARCH
             ========================= -->

        <main id="home-screen" class="screen">

            <section class="hero">

                <h2>Find your next meal</h2>

                <p>Search recipes by ingredient</p>

                <form id="search-form" class="search-box">

                    <input id="search-input" type="text" placeholder="Search by ingredient..." autocomplete="off">

                    <button type="submit">
                        🔍
                    </button>

                </form>

            </section>


            <!-- RESULTS -->

            <section id="results-section" class="results-section">

                <div class="section-heading">

                    <h2 id="results-title">
                        Popular Recipes
                    </h2>

                </div>

                <div id="recipe-grid" class="recipe-grid"></div>

            </section>

        </main>


        <!-- =========================
             RECIPE DETAILS
             ========================= -->

        <main id="details-screen" class="screen hidden">

            <button id="back-button" class="back-button" type="button">
                ← Back
            </button>

            <article id="recipe-details" class="recipe-details"></article>

        </main>


        <!-- =========================
             SAVED RECIPES
             ========================= -->

        <main id="saved-screen" class="screen hidden">

            <button id="saved-back-button" class="back-button" type="button">
                ← Back
            </button>

            <section class="saved-section">

                <div class="section-heading">

                    <h2>Saved Recipes</h2>

                    <p>Your favorite recipes in one place.</p>

                </div>

                <div id="saved-grid" class="recipe-grid"></div>

            </section>

        </main>


        <!-- =========================
             LOADING
             ========================= -->

        <div id="loading" class="loading hidden">

            <div class="spinner"></div>

            <p>Finding delicious recipes...</p>

        </div>


        <!-- =========================
             MESSAGE
             ========================= -->

        <div id="message" class="message hidden"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
